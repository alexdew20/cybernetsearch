<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER//NET — Поисковый Терминал Google</title>
  <style>
    :root {
      --bg-void: #05050a;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --panel-dark: rgba(12, 15, 28, 0.82);
      --text-main: #e2e8f0;
      --text-dim: #7f8ea3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg-void);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18),
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 50;
    }

    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0, 243, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      z-index: 0;
    }

    .ambient-glow {
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 0, 85, 0.18) 0%, rgba(0, 243, 255, 0.12) 45%, transparent 75%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      background: rgba(6, 8, 16, 0.75);
      backdrop-filter: blur(10px);
    }

    .sys-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--neon-cyan);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--neon-cyan);
      box-shadow: 0 0 12px var(--neon-cyan);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .clock-widget {
      text-align: right;
    }

    .clock-time {
      font-size: 22px;
      font-weight: 800;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(252, 238, 10, 0.45);
      letter-spacing: 2px;
    }

    .clock-date {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .glitch-title {
      font-size: clamp(36px, 6vw, 62px);
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 3px 0 var(--neon-pink), -3px 0 var(--neon-cyan);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      margin-bottom: 34px;
      text-transform: uppercase;
    }

    .search-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(15, 20, 36, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: var(--text-dim);
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #fff;
      border-color: var(--neon-cyan);
    }

    .tab-btn.active {
      background: var(--neon-cyan);
      color: #05050a;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
    }

    .search-frame {
      width: 100%;
      position: relative;
      padding: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-yellow));
      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.2);
    }

    .search-form {
      display: flex;
      align-items: center;
      background: #090b14;
      clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      padding: 6px 8px 6px 20px;
    }

    .prompt-prefix {
      color: var(--neon-pink);
      font-weight: 900;
      font-size: 18px;
      margin-right: 12px;
    }

    #searchInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      padding: 12px 0;
      letter-spacing: 0.5px;
    }

    #searchInput::placeholder {
      color: #4a5568;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 0 12px;
      display: none;
    }

    .clear-btn:hover {
      color: var(--neon-pink);
    }

    .submit-btn {
      background: var(--neon-yellow);
      color: #05050a;
      border: none;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: transform 0.15s, background 0.15s;
    }

    .submit-btn:hover {
      background: #fff;
      box-shadow: 0 0 20px var(--neon-yellow);
    }

    .submit-btn:active {
      transform: scale(0.96);
    }

    .live-url-bar {
      width: 100%;
      margin-top: 10px;
      padding: 8px 14px;
      background: rgba(0, 243, 255, 0.06);
      border-left: 3px solid var(--neon-cyan);
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .live-url-text {
      color: var(--neon-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }

    .live-url-text:hover {
      text-decoration: underline;
    }

    .quick-deck {
      width: 100%;
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }

    .deck-card {
      background: var(--panel-dark);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: all 0.2s;
      cursor: pointer;
    }

    .deck-card:hover {
      border-color: var(--neon-pink);
      background: rgba(255, 0, 85, 0.12);
      transform: translateY(-2px);
    }

    .deck-icon {
      font-size: 20px;
    }

    .deck-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .history-box {
      width: 100%;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .history-tag {
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.25);
      color: var(--neon-cyan);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .history-tag:hover {
      background: var(--neon-cyan);
      color: #000;
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 14px 32px;
      border-top: 1px solid rgba(255, 0, 85, 0.25);
      background: rgba(6, 8, 16, 0.8);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header, footer { padding: 14px 16px; }
      .submit-btn { padding: 14px 16px; font-size: 12px; }
      #searchInput { font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="cyber-grid"></div>
  <div class="ambient-glow"></div>

  <header>
    <div class="sys-status">
      <div class="pulse-dot"></div>
      <span>NET_LINK // GOOGLE_CORE_ONLINE</span>
    </div>
    <div class="clock-widget">
      <div class="clock-time" id="clockTime">00:00:00</div>
      <div class="clock-date" id="clockDate">ЗАГРУЗКА ДАТЫ...</div>
    </div>
  </header>

  <main>
    <div class="glitch-title">CYBER//SEARCH</div>
    <div class="subtitle">Ускоренный шлюз к базе данных Google</div>

    <div class="search-tabs" id="searchTabs">
      <button type="button" class="tab-btn active" data-mode="web">🌐 Веб-поиск</button>
      <button type="button" class="tab-btn" data-mode="images">🖼️ Картинки</button>
      <button type="button" class="tab-btn" data-mode="videos">🎬 Видео</button>
      <button type="button" class="tab-btn" data-mode="news">📡 Новости</button>
      <button type="button" class="tab-btn" data-mode="maps">📍 Карты</button>
    </div>

    <div class="search-frame">
      <form class="search-form" id="googleForm">
        <span class="prompt-prefix">&gt;_</span>
        <input type="text" id="searchInput" placeholder="Введите поисковый запрос..." autocomplete="off" autofocus required>
        <button type="button" class="clear-btn" id="clearBtn" title="Очистить">✕</button>
        <button type="submit" class="submit-btn">НАЙТИ</button>
      </form>
    </div>

    <div class="live-url-bar">
      <span>TARGET_URL:</span>
      <a class="live-url-text" id="liveUrlPreview" href="#" target="_blank" rel="noopener noreferrer">ожидание ввода...</a>
    </div>

    <div class="quick-deck" id="quickDeck"></div>

    <div class="history-box" id="historyBox"></div>
  </main>

  <footer>
    <div>SYS.VER 2077.4 // ENCRYPTION: ACTIVE</div>
    <div>PRESS [ENTER] TO EXECUTE QUERY</div>
  </footer>

  <script>
    const form = document.getElementById('googleForm');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const tabs = document.querySelectorAll('.tab-btn');
    const historyBox = document.getElementById('historyBox');
    const liveUrlPreview = document.getElementById('liveUrlPreview');
    const quickDeck = document.getElementById('quickDeck');

    let currentMode = 'web';

    // Сборка оригинальной ссылки Google через стандартный объект URL (без массивов)
    function buildGoogleUrl(rawQuery) {
      const q = rawQuery.trim();
      const urlObj = new URL('https://google.com');

      if (!q) return urlObj.toString();

      if (currentMode === 'maps') {
        urlObj.pathname = '/maps/search/' + encodeURIComponent(q);
        return urlObj.toString();
      }

      urlObj.pathname = '/search';
      urlObj.searchParams.set('q', q);

      if (currentMode === 'images') {
        urlObj.searchParams.set('tbm', 'isch');
      } else if (currentMode === 'videos') {
        urlObj.searchParams.set('tbm', 'vid');
      } else if (currentMode === 'news') {
        urlObj.searchParams.set('tbm', 'nws');
      }

      return urlObj.toString();
    }

    function updateUrlPreview() {
      const q = searchInput.value.trim();
      if (!q) {
        liveUrlPreview.textContent = 'ожидание ввода...';
        liveUrlPreview.href = '#';
        return;
      }
      const url = buildGoogleUrl(q);
      liveUrlPreview.textContent = url;
      liveUrlPreview.href = url;
    }

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        updateUrlPreview();
        searchInput.focus();
      });
    });

    function executeSearch(query) {
      const q = query.trim();
      if (!q) return;

      saveQuery(q);
      const targetUrl = buildGoogleUrl(q);
      window.open(targetUrl, '_blank', 'noopener,noreferrer');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      executeSearch(searchInput.value);
    });

    searchInput.addEventListener('input', () => {
      clearBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none';
      updateUrlPreview();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      updateUrlPreview();
      searchInput.focus();
    });

    // Генерация быстрых закладок через new Array()
    function renderQuickDeck() {
      const links = new Array(
        { icon: '▶', label: 'YOUTUBE', url: 'https://youtube.com' },
        { icon: '🔤', label: 'ПЕРЕВОДЧИК', url: 'https://translate.google.com/?hl=ru' },
        { icon: '✉️', label: 'GMAIL', url: 'https://mail.google.com' },
        { icon: '💾', label: 'GOOGLE ДИСК', url: 'https://drive.google.com' },
        { icon: '⚡', label: 'GITHUB', url: 'https://github.com' }
      );

      links.forEach(item => {
        const a = document.createElement('a');
        a.className = 'deck-card';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `<span class="deck-icon">${item.icon}</span><span class="deck-label">${item.label}</span>`;
        quickDeck.appendChild(a);
      });
    }

    function getHistory() {
      try {
        const raw = localStorage.getItem('cyber_search_history');
        return raw ? JSON.parse(raw) : new Array();
      } catch (e) {
        return new Array();
      }
    }

    function saveQuery(q) {
      let list = getHistory().filter(item => item.toLowerCase() !== q.toLowerCase());
      list.unshift(q);
      if (list.length > 6) list = list.slice(0, 6);
      try {
        localStorage.setItem('cyber_search_history', JSON.stringify(list));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      const list = getHistory();
      historyBox.innerHTML = '';
      if (list.length === 0) return;

      const label = document.createElement('span');
      label.style.color = '#7f8ea3';
      label.textContent = 'НЕДАВНИЕ ЗАПРОСЫ:';
      historyBox.appendChild(label);

      list.forEach(item => {
        const tag = document.createElement('span');
        tag.className = 'history-tag';
        tag.textContent = item;
        tag.addEventListener('click', () => {
          searchInput.value = item;
          clearBtn.style.display = 'block';
          updateUrlPreview();
          executeSearch(item);
        });
        historyBox.appendChild(tag);
      });
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ru-RU');
      const dateStr = now.toLocaleDateString('ru-RU', {
        weekday: 'short',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      document.getElementById('clockTime').textContent = timeStr;
      document.getElementById('clockDate').textContent = dateStr;
    }

    setInterval(updateClock, 1000);
    updateClock();
    renderQuickDeck();
    renderHistory();
  </script>
</body>
</html>
